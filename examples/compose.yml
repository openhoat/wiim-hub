services:

  wiim-hub:
    # The published image; replace it with `build: ..` to run the working tree.
    image: ghcr.io/openhoat/wiim-hub:latest
    container_name: wiim-hub
    ports:
      - "8090:8090"
    environment:
      - PORT=8090
      - POLL_MS=3000
      - DEVICE_HOSTS=192.168.1.10
      - DISCOVERY=1
    restart: unless-stopped
