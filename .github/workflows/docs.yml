name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Pages needs to write the deployment and mint the OIDC token it verifies.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time: a second push waits rather than cancelling the one
# in flight, so the published site always matches a commit that built.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # The same task as local: it produces the mark from docs/img/logo.svg,
      # then the static site.
      - run: npm run docs:build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
