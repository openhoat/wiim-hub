<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Read-only view of WiiM devices on the local network" />
    <title>WiiM Web</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <div class="titles">
        <h1 data-i18n="title">WiiM Web</h1>
        <p class="sub" data-i18n="subtitle"></p>
      </div>
      <div class="actions">
        <span id="stamp" class="stamp"></span>
        <div class="views" role="group" aria-label="view">
          <button type="button" data-view="user" data-i18n="views.user"></button>
          <button type="button" data-view="diagnostic" data-i18n="views.diagnostic"></button>
        </div>
        <label class="pick">
          <span data-i18n="language"></span>
          <select id="lang">
            <option value="auto" data-i18n="auto"></option>
            <option value="en">en</option>
            <option value="fr">fr</option>
          </select>
        </label>
        <label class="pick">
          <span data-i18n="theme"></span>
          <select id="theme">
            <option value="auto" data-i18n="auto"></option>
            <option value="dark" data-i18n="dark"></option>
            <option value="light" data-i18n="light"></option>
          </select>
        </label>
        <button id="discover" type="button" data-i18n="discover"></button>
      </div>
    </header>
    <main id="devices"></main>
    <p id="empty" class="empty" hidden data-i18n="empty"></p>

    <template id="card-user">
      <section class="card user">
        <div class="head">
          <span class="dot"></span>
          <h2 class="name"></h2>
          <span class="model"></span>
          <span class="badge source"></span>
          <span class="badge offline" data-i18n="offline" hidden></span>
        </div>
        <div class="now">
          <img class="art" alt="" hidden />
          <div class="meta">
            <span class="title"></span>
            <span class="who"></span>
            <div class="progress" hidden>
              <div class="bar"><div class="fill"></div></div>
              <span class="times"></span>
            </div>
          </div>
        </div>
        <div class="chips">
          <span class="chip state"></span>
          <span class="chip volume"></span>
          <span class="chip group" hidden></span>
        </div>
      </section>
    </template>

    <template id="card-diagnostic">
      <section class="card diagnostic">
        <div class="head">
          <span class="dot"></span>
          <h2 class="name"></h2>
          <span class="model"></span>
          <span class="badge source"></span>
        </div>
        <p class="track"><span class="title"></span><span class="who"></span></p>
        <dl class="grid"></dl>
        <figure class="spark">
          <svg viewBox="0 0 320 64" preserveAspectRatio="none"></svg>
          <figcaption class="rssi"></figcaption>
        </figure>
        <div class="cardfoot">
          <button class="details" type="button" data-i18n="details"></button>
          <span class="alert"></span>
        </div>
        <div class="detail" hidden>
          <table class="samples">
            <thead>
              <tr>
                <th data-i18n="table.time"></th>
                <th data-i18n="table.rssi"></th>
                <th data-i18n="table.volume"></th>
                <th data-i18n="table.state"></th>
                <th data-i18n="table.online"></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          <button class="export" type="button" data-i18n="export"></button>
        </div>
        <ul class="events"></ul>
      </section>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
