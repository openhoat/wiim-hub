sonar.projectKey=wiim-hub
sonar.projectName=WiiM Hub

sonar.sources=src,server
sonar.exclusions=server/**/*.test.ts

sonar.tests=server
sonar.test.inclusions=server/**/*.test.ts
sonar.cpd.exclusions=server/**/*.test.ts

sonar.sourceEncoding=UTF-8
sonar.typescript.lcov.reportPaths=dist/coverage/lcov.info

# The unit suite instruments the pure layer only: the UI is covered by the
# Playwright suite, whose coverage Sonar does not ingest, and the network
# modules are exercised against real hardware. Excluding them keeps the
# coverage metric on what the unit suite actually measures.
sonar.coverage.exclusions=src/**,server/device/**,server/demo.ts,server/discovery.ts,server/mdns.ts,server/server.ts

# The scan leaves what it writes under dist/, with every other generated file.
sonar.working.directory=dist/sonar
