sonar.projectKey=wiim-hub
sonar.projectName=WiiM Hub

sonar.sources=src,server
sonar.exclusions=server/**/*.test.ts

sonar.tests=server
sonar.test.inclusions=server/**/*.test.ts
sonar.cpd.exclusions=server/**/*.test.ts

sonar.sourceEncoding=UTF-8
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# The scan leaves everything it writes in one gitignored directory.
sonar.working.directory=.scannerwork
